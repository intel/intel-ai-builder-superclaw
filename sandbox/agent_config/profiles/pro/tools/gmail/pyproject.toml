[project]
name = "gmail-sync"
version = "0.1.0"
description = "Gmail sync and email pipeline agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.2",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "requests>=2.33.1",
    "urllib3>=2.8.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "arrow>=1.3.0",
    "tzlocal>=5.0",
]

[tool.uv]
# Pin the transitive `cryptography` up to the patched release for Dependabot
# cryptography is pulled in via google-auth / google-api-python-client;
# constrain it here so `uv lock` cannot regress it below the fix.
constraint-dependencies = ["cryptography>=50.0.0", "pyasn1>=0.6.5", "certifi>=2026.10.19", "oauthlib>=4.0.1"]
