[project]
name = "superclaw-host-observability"
version = "0.1.0"
description = "Shared crash-reporting adapter for SuperClaw Windows-host services"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SuperClaw" }]

dependencies = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superclaw_host_observability"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
