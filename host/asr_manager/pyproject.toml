[project]
name = "asr-manager"
version = "0.1.0"
description = "SuperClaw ASR Manager: native Windows-host Parakeet TDT 0.6B v2 (int8) speech-to-text service (onnxruntime, no torch)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SuperClaw" }]

# ONNX RUNTIME, NO PYTORCH -- same rule tts_manager follows, and for the same
# reason: the workspace's torch exclude in superclaw_services.spec is what keeps
# ~361 MB out of the shipped bundle, so a new member must not reintroduce a torch
# dependant. The ENC pipeline drives the encoder/decoder/joiner ONNX trio through
# onnxruntime directly (see recognize/enc_pipeline.py) and the mel front end is a
# numpy reimplementation of NeMo's FilterbankFeatures, so numpy + onnxruntime is
# the whole inference stack. sherpa-onnx is deliberately NOT a dependency: its
# offline API cannot hand back the encoder frames the ENC pipeline windows, which
# is the entire reason that pipeline exists.
#
# onnxruntime is pinned `>=1.30` rather than inherited. tts_manager and
# privacy_manager (`>=1.17`) share the single resolved version in
# host/uv.lock, which was 1.27.0; stating the floor here is what makes the
# 1.27 -> 1.30 upgrade a declared decision in the tree instead of a `uv lock
# --upgrade-package onnxruntime` side effect that the next lock refresh could undo.
#
# llmrouter-manager is a dependency for exactly one function:
# `llmrouter_manager.local.hf_endpoint.resolve_hf_endpoint()`, the official-site /
# hf-mirror.com auto-selector that also honours a user-set HF_ENDPOINT. That module
# imports only httpx + loguru, and recognize/download.py imports it lazily, so the
# heavy half of llmrouter_manager is never touched. Copying the resolver instead
# would make another copy of it in this repo, and the plan explicitly says to
# reuse it rather than re-derive the KOKORO_WEIGHTS_URL-style manual override,
# which has no automatic fallback.
#
# httpx is a RUNTIME dependency as of the LLM clean-up pass (`refine/client.py`),
# which POSTs to llmrouter_manager's data plane on loopback. It was already
# reaching this service transitively through the llmrouter-manager dep above, so
# this line changes no resolved version -- it states the dependency that is now
# actually used at runtime rather than leaving a first-class outbound call resting
# on another package's requirements. Declared rather than reusing urllib (which
# recognize/download.py uses) because the refine route is async: urlopen would
# block the event loop for the whole cloud round trip, stalling every concurrent
# request to this service, and privacy_manager's call to the same data plane
# already establishes httpx + trust_env=False as the pattern here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy<3",
    "onnxruntime>=1.30",
    "loguru>=0.6",
    "httpx>=0.27",
    "certifi",
    "superclaw-host-observability",
    "llmrouter-manager",
]

[project.scripts]
asr-manager = "asr_manager.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_manager"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = true
constraint-dependencies = ["starlette>=1.3.1"]

[tool.uv.sources]
superclaw-host-observability = { workspace = true }
llmrouter-manager = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
