[project]
name = "mcp-host-manager"
version = "0.1.0"
description = "SuperClaw host MCP gateway: runs user-chosen MCP servers outside the sandbox, with per-call approval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SuperClaw" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "loguru>=0.6",
    "superclaw-contracts",
    "superclaw-host-observability",
]

[project.scripts]
mcp-host-manager = "mcp_host_manager.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_host_manager"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = true
constraint-dependencies = ["starlette>=1.3.1"]

[tool.uv.sources]
superclaw-contracts = { workspace = true }
superclaw-host-observability = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "windows_only: needs a real Windows host (Job Objects, WTS session state); skipped elsewhere",
]
