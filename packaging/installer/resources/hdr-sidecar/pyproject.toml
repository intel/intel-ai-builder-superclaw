[project]
name = "hybrid-dr-orchestrator"
version = "0.1.0"
description = "LangGraph-based sidecar rewrite of SuperClaw hybrid deep-research orchestration"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SuperClaw" }]

dependencies = [
    "langgraph>=1.2.14",
    "langchain-core>=0.3.0",
    "langsmith>=0.8.18",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anyio>=4.14.2",
    "ddgs>=9.0",
    # Cloud LLM is reached via the in-container llmrouter (PII-sanitizing
    # proxy at :18321). We talk to it with plain httpx + the OpenAI
    # /v1/chat/completions wire format — no SDK lock-in.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
hybrid-dr-sidecar = "hybrid_dr_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = ["starlette>=1.3.1", "certifi>=2026.10.19", "brotli>=1.2.1", "brotlicffi>=1.2.1.0", "urllib3>=2.8.0", "hpack>=4.2.0", "langgraph-sdk>=0.4.6", "h2>=4.4.1", "setuptools>=84.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_dr_orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"src/hybrid_dr_orchestrator/pipeline_config.json" = "hybrid_dr_orchestrator/pipeline_config.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
